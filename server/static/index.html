<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Plot Visualizer Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/three.min.js"></script>
    <script src="/static/OrbitControls.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <header>
                <h1>Tesseract Studio <span class="badge">PRO</span></h1>
                <p>8×8×8 LED Volumetric Display</p>
            </header>

            <div class="control-group">
                <label>Mathematical Functions</label>
                <div id="equations-container">
                    <!-- Equation rows will be injected here by JS -->
                </div>
                <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                    <button id="btn-add-eq" class="btn secondary btn-small" style="flex: 1;">
                        + Add Equation
                    </button>
                    <button id="btn-huygens-demo" class="btn primary btn-small" style="flex: 1;">
                        Load Huygens'
                    </button>
                </div>
                <small>Valid variables: x, y, z, t, sin, cos, sqrt, pi<br>Supports Inequalities (<, >) and Logic (and, or)</small>
            </div>

            <div class="control-group">
                <label>Playback Controls (Time 't' = <span id="t-val-display" style="font-family: monospace;">0.0</span>)</label>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button id="btn-play-pause" class="btn secondary btn-small" style="min-width: 80px;">Pause</button>
                    <input type="range" id="t-scrubber" min="0" max="100" step="0.1" value="0" style="flex-grow: 1;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.25rem;">
                    <small>Speed: <span id="speed-label">1.0</span>x</small>
                    <input type="range" id="speed-slider" min="-3" max="5" step="0.1" value="1.0" style="width: 100px;">
                </div>
            </div>

            <div class="control-group">
                <label>Hardware Streaming</label>
                <div class="connection-tabs">
                    <button class="tab-btn active" data-mode="usb">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        USB
                    </button>
                    <button class="tab-btn" data-mode="wifi">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                        WiFi
                    </button>
                </div>
                <div id="usb-settings" class="connection-panel">
                    <div class="input-wrapper" style="margin-bottom: 0.5rem;">
                        <span>COM</span>
                        <input type="text" id="serial-port" value="COM5" placeholder="e.g. COM5">
                    </div>
                </div>
                <div id="wifi-settings" style="display: none;" class="connection-panel">
                    <div class="input-wrapper" style="margin-bottom: 0.5rem;">
                        <span>IP</span>
                        <input type="text" id="wifi-ip" value="192.168.4.1" placeholder="ESP32 IP address">
                    </div>
                </div>
                <button id="btn-stream" class="btn danger" style="width: 100%;">
                    <span class="status-indicator" id="stream-status"></span>
                    Start USB Streaming
                </button>
            </div>

            <div class="control-group">
                <label>Coordinate Space</label>
                <div class="coord-controls">
                    <div class="coord-row">
                        <span class="coord-label">Origin</span>
                        <input type="number" id="origin-x" class="coord-input" value="0" step="0.5" title="Origin X">
                        <input type="number" id="origin-y" class="coord-input" value="0" step="0.5" title="Origin Y">
                        <input type="number" id="origin-z" class="coord-input" value="0" step="0.5" title="Origin Z">
                    </div>
                    <div style="display: flex; gap: 0.4rem; margin-top: 0.4rem;">
                        <button id="btn-origin-corner" class="btn secondary btn-small btn-toggle active" style="flex:1;">⊡ Corner</button>
                        <button id="btn-origin-center" class="btn secondary btn-small btn-toggle" style="flex:1;">⊕ Center</button>
                    </div>
                    <div class="coord-row" style="margin-top: 0.6rem;">
                        <span class="coord-label">Scale</span>
                        <span id="scale-label" style="font-family: monospace; font-size: 0.85rem; min-width: 30px; text-align: center;">1.0</span>
                        <input type="range" id="scale-factor" min="0.1" max="5" step="0.1" value="1" style="flex: 1;">
                        <button id="btn-scale-reset" class="btn secondary btn-small" style="font-size: 0.7rem; padding: 0.3rem 0.5rem;">Reset</button>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Grid Resolution</label>
                <div class="coord-controls">
                    <div class="coord-row">
                        <span class="coord-label">Size</span>
                        <input type="number" id="grid-size" class="coord-input" value="8" min="2" max="64" step="1" style="flex: 1;" title="Grid NxNxN">
                        <span style="color: var(--text-muted); font-size: 0.75rem; white-space: nowrap;">× <span id="grid-label">8×8×8</span></span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem;">
                        <input type="checkbox" id="free-mode-toggle" style="cursor: pointer;">
                        <label for="free-mode-toggle" style="margin: 0; font-size: 0.8rem; cursor: pointer; color: var(--text-muted);">Free Mode (decouple from hardware 8³)</label>
                    </div>
                </div>
            </div>

            <button id="btn-update" class="btn primary">Render 3D Preview</button>
            <div style="display: flex; align-items: center; justify-content: center; margin-top: 0.8rem; gap: 0.4rem; color: #94a3b8;">
                <input type="checkbox" id="auto-render-toggle" style="cursor: pointer;">
                <label for="auto-render-toggle" style="margin: 0; font-size: 0.85rem; cursor: pointer;">Auto-render on type</label>
            </div>
        </aside>

        <!-- 3D Canvas Area -->
        <main class="canvas-container">
            <div id="three-canvas"></div>
            
            <!-- Statistics Overlay -->
            <div class="stats-overlay">
                <div class="stat-box">
                    <span class="stat-label">FPS</span>
                    <span class="stat-value" id="fps-counter">60</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Active Voxels</span>
                    <span class="stat-value" id="voxel-counter">64</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Power Est.</span>
                    <span class="stat-value" id="power-counter">~15A</span>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/static/main.js"></script>
</body>
</html>
